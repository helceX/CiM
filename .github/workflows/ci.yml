name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://cim:cim@localhost:5432/cim
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cim
          POSTGRES_PASSWORD: cim
          POSTGRES_DB: cim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cim -d cim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # packages/reports renders PDFs via headless Chromium (real
        # Chromium tests + the actual generate_report worker job) — the
        # runner has no browser installed until this step provisions one.
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
