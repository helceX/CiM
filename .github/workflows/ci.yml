name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://cim:cim@localhost:5432/cim
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
  # The built-in demo "network" for connecting an account in tests (never set in production).
  SOCIAL_MOCK_PROVIDER: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cim
          POSTGRES_PASSWORD: cim
          POSTGRES_DB: cim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cim -d cim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # packages/reports renders PDFs via headless Chromium (real
        # Chromium tests + the actual generate_report worker job) — the
        # runner has no browser installed until this step provisions one.
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    # Build-only verification that apps/web/Dockerfile and
    # apps/worker/Dockerfile still produce a working image on every
    # push/PR — not a deploy (no registry/hosting target chosen yet, see
    # docs/deployment/DEPLOYMENT.md). Once one is, this is where `push:
    # true` + registry login + a deploy trigger get added.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.target }}/Dockerfile -t cim-${{ matrix.target }}:ci .

      - name: Smoke test the web image behind a proxy-style Host/Origin
        # A green `docker build` says nothing about whether the image works
        # once running. This class of bug already shipped once: the
        # standalone server reports its origin as http://0.0.0.0:<port>, so
        # behind Railway/Cloudflare (Origin https://mediaory.io) every
        # mutating API call, login included, was rejected as cross-origin.
        # An empty login body is rejected with 400 only if the request got
        # past the CSRF check (Redis is needed for the rate limiter that
        # runs first; no database is touched).
        if: matrix.target == 'web'
        run: |
          docker run -d --name redis --network host redis:8-alpine
          docker run -d --name web --network host \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e APP_URL=https://mediaory.io \
            cim-web:ci
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          expect() { # name expected-status curl-args...
            local name="$1" want="$2"; shift 2
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/auth/login \
              -H 'Content-Type: application/json' -d '{}' "$@")
            echo "$name -> $got (want $want)"
            [ "$got" = "$want" ] || { docker logs web; exit 1; }
          }
          expect "public origin via proxy headers" 400 -H 'Host: mediaory.io' -H 'X-Forwarded-Proto: https' -H 'Origin: https://mediaory.io'
          expect "cross-site origin" 403 -H 'Host: mediaory.io' -H 'X-Forwarded-Proto: https' -H 'Origin: https://evil.example'
          expect "no Origin or Referer" 403
          css=$(curl -s http://127.0.0.1:3000/ | grep -o '/_next/static/[^"]*\.css' | head -1)
          [ -n "$css" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$css")" = "200" ] \
            || { echo "stylesheet not served"; docker logs web; exit 1; }

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/ui/**'

  e2e:
    needs: changes
    # docs/testing/TEST_STRATEGY.md — "E2E and a11y suites run on PRs
    # touching apps/web or packages/ui," not on every PR (they exercise
    # the whole app through a real browser, real Postgres/Redis, and a
    # real headless-Chromium report render — meaningfully slower than
    # the unconditional checks job above).
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cim
          POSTGRES_PASSWORD: cim
          POSTGRES_DB: cim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cim -d cim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed demo data
        # e2e/simulate.ts's crawl simulation targets the seeded "Daily
        # Tech Wire" source by name (packages/db/src/seed.ts) — without
        # this, every E2E test that needs a real mention has nothing to
        # crawl.
        run: pnpm db:seed

      - name: E2E + accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
